<!doctype html>
<html lang="en" data-palette="{{palette}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <title>Claude Code Webview</title>
  <link rel="icon" href="{{assets}}/favicons/{{palette}}.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{assets}}/favicons/{{palette}}.png">
  <link rel="stylesheet" href="{{assets}}/vendor/xterm.css">
  <link rel="stylesheet" href="{{assets}}/vendor/file-views/file-views.css">
  <link rel="stylesheet" href="{{assets}}/style.css">
  <script type="importmap">
    {
      "imports": {
        "marked": "{{assets}}/vendor/marked.js",
        "dompurify": "{{assets}}/vendor/purify.js",
        "highlight.js": "{{assets}}/vendor/highlight.js",
        "@xterm/xterm": "{{assets}}/vendor/xterm.js",
        "file-views": "{{assets}}/vendor/file-views/file-views.js"{{editorImports}}
      }
    }
  </script>
  <script type="module" src="{{assets}}/app.js"></script>
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="spark" aria-hidden="true">✻</span>
        <span>Claude Code Webview</span>
        <span class="usage" id="usage" hidden></span>
        <span class="usage" id="usage-codex" hidden></span>
      </div>
      <div class="sidebar-modes" id="sidebar-modes" role="group" aria-label="What the sidebar shows" hidden>
        <button type="button" data-mode="herdr" title="herdr's workspaces and their tabs, as herdr shows them">herdr</button>
        <button type="button" data-mode="sessions" title="Every session, latest first">Sessions</button>
      </div>
      <div class="search-row">
        <input class="search" id="search" type="search" placeholder="Search by title or folder" autocomplete="off">
      </div>
      <div class="session-options" id="session-options">
        <label class="sidebar-option">
          <input type="checkbox" id="follow">
          <span>Follow the active session</span>
        </label>
        <label class="sidebar-option" title="Sessions that a program drives through claude -p or the Agent SDK">
          <input type="checkbox" id="show-sdk">
          <span>Show SDK sessions</span>
        </label>
        <label class="sidebar-option" id="group-workspaces-option" title="herdr's workspaces: the one a session runs or ran in, or the only one with a pane open in its folder" hidden>
          <input type="checkbox" id="group-workspaces">
          <span>Group by herdr workspace</span>
        </label>
        <label class="sidebar-option" id="closed-only-option" title="Sessions that ran in a herdr tab closed since: find one by its workspace and tab, and open it again" hidden>
          <input type="checkbox" id="closed-only">
          <span>Closed in herdr</span>
        </label>
      </div>
      <nav class="session-list" id="session-list" aria-label="Sessions"></nav>
      <div class="herdr-panel" id="herdr-panel" hidden></div>
    </aside>
    <main class="main" id="main">
      <div class="empty-state" id="empty-state">Pick a session on the left</div>
    </main>
    <aside class="file-panel" id="file-panel" aria-label="File" hidden></aside>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
</body>
</html>
